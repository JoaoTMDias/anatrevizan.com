name: ORCID publication sync

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orcid-publication-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronization target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize ORCID snapshot
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: pnpm sync:orcid:strict --stats-file=/tmp/orcid-stats.json

      - name: Validate generated content
        run: pnpm validate:content && pnpm test -- tests/orcid-publications.test.ts tests/publications.test.ts

      - name: Prepare update branch
        id: changes
        run: |
          if git diff --quiet -- src/content/publications; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/orcid-publications
          git add -- src/content/publications
          git commit -m "chore: synchronize ORCID publications"
          git push --force-with-lease origin automation/orcid-publications

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const stats = JSON.parse(readFileSync("/tmp/orcid-stats.json", "utf8"));
            writeFileSync("/tmp/orcid-pr.md", [
              "## ORCID publication snapshot",
              "",
              `- Additions: ${stats.added}`,
              `- Updates: ${stats.updated}`,
              `- Removals: ${stats.removed}`,
              `- Works without a publishable URL: ${stats.withoutUrl}`,
              `- Total works: ${stats.total}`,
              "",
              "Generated by the strict weekly ORCID synchronization. Editorial overlay fields are preserved by sourceId."
            ].join("\n"));'
          number="$(gh pr list --head automation/orcid-publications --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore: synchronize ORCID publications" --body-file /tmp/orcid-pr.md
          else
            gh pr create --head automation/orcid-publications --base "$TARGET_BRANCH" --title "chore: synchronize ORCID publications" --body-file /tmp/orcid-pr.md
          fi
