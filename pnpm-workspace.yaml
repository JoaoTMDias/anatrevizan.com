# Not a monorepo — `packages` is only here so pnpm <10.5.0 accepts this
# settings file instead of failing with "packages field missing or empty".
packages:
  - '.'

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - sharp
allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.2.6'
  - '@astrojs/internal-helpers@0.11.0'
  - '@astrojs/markdown-satteri@0.4.0'
  - '@astrojs/mdx@8.0.0'
  - '@astrojs/netlify@8.2.5'
  - '@astrojs/node@11.1.5'
  - '@astrojs/react@6.0.5'
  - '@astrojs/sitemap@3.7.4'
  - '@astrojs/vercel@11.0.9'
  - astro@7.2.10
  - shadcn@4.19.1
